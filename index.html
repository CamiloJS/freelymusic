<!doctype html>
<html lang="es" class="bg-black">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Música</title>

    <!-- Warm up the connections needed for the first paint and playback. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://file.garden" crossorigin />
    <link rel="preconnect" href="https://i.scdn.co" crossorigin />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link rel="dns-prefetch" href="https://file.garden" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Música" />
    <meta
      property="og:description"
      content="Tu reproductor privado de música en la nube con letras sincronizadas y modo sin conexión."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Música" />
    <meta
      name="twitter:description"
      content="Tu reproductor privado de música en la nube con letras sincronizadas y modo sin conexión."
    />

    <style>
      html, body {
        background-color: #000000 !important;
        color: #ffffff;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }

      /* Instant loading screen: the app used to show a blank black page until
         the whole JS bundle had downloaded and parsed. */
      .app-boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: radial-gradient(circle at 50% 30%, rgba(16, 185, 129, 0.14), transparent 55%), #000;
      }

      .app-boot-logo {
        width: 64px;
        height: 64px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        background: linear-gradient(135deg, #10b981, #34d399);
        box-shadow: 0 16px 40px rgba(16, 185, 129, 0.28);
      }

      .app-boot-title {
        color: #ffffff;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      .app-boot-spinner {
        width: 22px;
        height: 22px;
        border-radius: 999px;
        border: 2px solid rgba(255, 255, 255, 0.15);
        border-top-color: #10b981;
        animation: app-boot-spin 0.8s linear infinite;
      }

      .app-boot-text {
        color: #9ca3af;
        font-size: 12px;
        font-weight: 600;
      }

      @keyframes app-boot-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-boot-spinner { animation: none; }
      }
    </style>

    <!-- Auto-recovery from stale PWA cache -->
    <script>
      window.addEventListener('error', function (event) {
        if (event.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK')) {
          var key = 'musica_reload_attempt';
          var last = sessionStorage.getItem(key);
          if (!last) {
            sessionStorage.setItem(key, Date.now());
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (registrations) {
                for (var i = 0; i < registrations.length; i++) {
                  registrations[i].unregister();
                }
                if (window.caches) {
                  caches.keys().then(function (names) {
                    return Promise.all(names.map(function (n) { return caches.delete(n); }));
                  }).then(function () {
                    window.location.reload();
                  });
                } else {
                  window.location.reload();
                }
              });
            } else {
              window.location.reload();
            }
          }
        }
      }, true);
    </script>

    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1ed760" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Música" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    
    <meta name="description" content="Reproductor privado de música por enlaces en la nube con letras sincronizadas estilo Apple Music y modo sin conexión." />
  </head>
  <body class="bg-black text-white">
    <div id="root">
      <div class="app-boot" role="status" aria-live="polite">
        <div class="app-boot-logo" aria-hidden="true">🎵</div>
        <div class="app-boot-title">Música</div>
        <div class="app-boot-spinner" aria-hidden="true"></div>
        <div class="app-boot-text">Cargando tu biblioteca...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch((err) => {
            console.log('SW registration error:', err);
          });
        });
      }
    </script>
  </body>
</html>
