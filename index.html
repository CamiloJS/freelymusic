<!doctype html>

    <link rel="manifest" href="/manifest.webmanifest?v=8" />
    <meta name="theme-color" content="#121212" />
    <meta name="application-name" content="Spotifree" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spotifree" />

    <!-- Warm up the connections needed for the first paint and playback. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://file.garden" crossorigin />
    <link rel="preconnect" href="https://i.scdn.co" crossorigin />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link rel="dns-prefetch" href="https://file.garden" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Spotifree" />
    <meta
      property="og:description"
      content="Tu reproductor privado de música en la nube con letras sincronizadas y modo 100% sin conexión."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Spotifree" />
    <meta
      name="twitter:description"
      content="Tu reproductor privado de música en la nube con letras sincronizadas y modo 100% sin conexión."
    />

    <style>
      html, body {
        background-color: #000000 !important;
        color: #ffffff;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }

      /* Instant loading screen: the app used to show a blank black page until
         the whole JS bundle had downloaded and parsed. */
      .app-boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: radial-gradient(circle at 50% 30%, rgba(16, 185, 129, 0.14), transparent 55%), #000;
      }

      .app-boot-logo {
        width: 64px;
        height: 64px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        background: linear-gradient(135deg, #10b981, #34d399);
        box-shadow: 0 16px 40px rgba(16, 185, 129, 0.28);
      }

      .app-boot-title {
        color: #ffffff;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      .app-boot-spinner {
        width: 22px;
        height: 22px;
        border-radius: 999px;
        border: 2px solid rgba(255, 255, 255, 0.15);
        border-top-color: #10b981;
        animation: app-boot-spin 0.8s linear infinite;
      }

      .app-boot-text {
        color: #9ca3af;
        font-size: 12px;
        font-weight: 600;
      }

      @keyframes app-boot-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-boot-spinner { animation: none; }
      }
    </style>

    <!-- Auto-recovery from stale PWA cache -->
    <script>
      window.addEventListener('error', function (event) {
        // Offline must never trigger the destructive cache reset. The service
        // worker is the one that serves the app in that case.
        if (!navigator.onLine) return;
        if (event.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK')) {
          var key = 'musica_reload_attempt';
          var last = sessionStorage.getItem(key);
          if (!last) {
            sessionStorage.setItem(key, Date.now());
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (registrations) {
                for (var i = 0; i < registrations.length; i++) {
                  registrations[i].unregister();
                }
                if (window.caches) {
                  caches.keys().then(function (names) {
                    return Promise.all(names.map(function (n) { return caches.delete(n); }));
                  }).then(function () {
                    window.location.reload();
                  });
                } else {
                  window.location.reload();
                }
              });
            } else {
              window.location.reload();
            }
          }
        }
      }, true);
    </script>

    <meta name="description" content="Spotifree: reproductor móvil de música en la nube con letras sincronizadas y soporte offline nativo." />
  </head>
  <body class="bg-black text-white">
    <div id="root">
      <div class="app-boot" role="status" aria-live="polite">
        <div class="app-boot-logo" aria-hidden="true">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="#000">
            <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.586 14.424c-.18.295-.563.387-.857.207-2.35-1.435-5.308-1.76-8.793-.963-.335.077-.67-.133-.746-.468-.077-.334.132-.67.467-.746 3.808-.87 7.076-.496 9.722 1.115.294.18.386.562.207.855zm1.225-2.724c-.227.367-.708.482-1.075.255-2.69-1.653-6.79-2.133-9.972-1.168-.413.125-.853-.109-.978-.522-.125-.413.109-.853.522-.978 3.633-1.103 8.147-.568 11.248 1.338.367.227.482.708.255 1.075zm.105-2.835C14.692 8.95 9.375 8.775 6.297 9.71c-.494.15-1.02-.132-1.17-.626-.15-.494.132-1.02.626-1.17 3.535-1.073 9.404-.866 13.115 1.338.445.264.59.838.326 1.282-.264.444-.838.59-1.282.326z"/>
          </svg>
        </div>
        <div class="app-boot-title">Spotifree</div>
        <div class="app-boot-spinner" aria-hidden="true"></div>
        <div class="app-boot-text">Cargando biblioteca offline...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((registration) => {
              // Manejo de eventos del ciclo de vida: oninstalled y onupdatefound
              registration.onupdatefound = () => {
                const installingWorker = registration.installing;
                if (!installingWorker) return;

                installingWorker.onstatechange = () => {
                  if (installingWorker.state === 'installed') {
                    if (navigator.serviceWorker.controller) {
                      console.log('[PWA] Nueva versión disponible. Actualizando en segundo plano...');
                      installingWorker.postMessage({ type: 'SKIP_WAITING' });
                    } else {
                      console.log('[PWA] Precaché completado exitosamente: lista para uso 100% offline (oninstalled).');
                    }
                  }
                };
              };

              // Comprobación periódica de actualizaciones
              setInterval(() => {
                if (navigator.onLine) {
                  registration.update().catch(() => {});
                }
              }, 45 * 60 * 1000);
            })
            .catch((err) => {
              console.warn('[PWA] Error en registro de Service Worker:', err);
            });

          // Recarga suave cuando el nuevo worker asume el control
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>
  </body>
</html>
